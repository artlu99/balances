<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>My balances</title>
	<style>
		:root {
			color-scheme: light dark;
			--bg: #0f1216;
			--surface: #171b22;
			--border: #2a3140;
			--text: #e8ecf1;
			--muted: #8b96a8;
			--accent: #6ee7b7;
			--danger: #f87171;
			--radius: 12px;
			font-family: system-ui, "Segoe UI", Roboto, sans-serif;
		}

		@media (prefers-color-scheme: light) {
			:root {
				--bg: #f4f6f9;
				--surface: #fff;
				--border: #e1e6ed;
				--text: #1a1f26;
				--muted: #5c6778;
			}
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 1.5rem;
			background: var(--bg);
			color: var(--text);
			line-height: 1.5;
		}

		.cards {
			width: min(28rem, 100%);
			display: grid;
			gap: 1rem;
		}

		main {
			width: min(28rem, 100%);
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			padding: 1.5rem 1.5rem 1.25rem;
			box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
		}

		h1 {
			margin: 0 0 1rem;
			font-size: 1.125rem;
			font-weight: 600;
			letter-spacing: -0.02em;
		}

		dl {
			margin: 0;
			display: grid;
			gap: 0.75rem 1rem;
		}

		.row {
			display: grid;
			grid-template-columns: auto 1fr;
			gap: 0.35rem 1rem;
			align-items: baseline;
		}

		dt {
			margin: 0;
			font-size: 0.75rem;
			font-weight: 600;
			text-transform: uppercase;
			letter-spacing: 0.06em;
			color: var(--muted);
		}

		dd {
			margin: 0;
			font-size: 0.95rem;
			font-variant-numeric: tabular-nums;
			text-align: right;
		}

		.badge {
			display: inline-block;
			padding: 0.15rem 0.5rem;
			border-radius: 999px;
			font-size: 0.8rem;
			font-weight: 600;
		}

		.badge.ok {
			background: color-mix(in srgb, var(--accent) 22%, transparent);
			color: var(--accent);
		}

		.badge.no {
			background: color-mix(in srgb, var(--danger) 22%, transparent);
			color: var(--danger);
		}

		.state {
			margin: 0;
			font-size: 0.9rem;
			color: var(--muted);
		}

		.state.error {
			color: var(--danger);
		}

		.btn {
			display: inline-block;
			padding: 0.4rem 0.9rem;
			border: 1px solid var(--border);
			border-radius: 8px;
			background: var(--surface);
			color: var(--text);
			font-size: 0.85rem;
			font-weight: 600;
			cursor: pointer;
			transition: opacity 0.15s;
		}

		.btn:hover:not(:disabled) {
			opacity: 0.85;
		}

		.btn:disabled {
			opacity: 0.45;
			cursor: default;
		}

		.wallet-info {
			font-size: 0.8rem;
			color: var(--muted);
			font-variant-numeric: tabular-nums;
		}
	</style>
</head>

<body>
	<div class="cards">
	<main>
		<h1>Venice AI <span id="key-hint" style="color:var(--muted);font-size:.75rem"></span></h1>
		<p id="state" class="state">Loading…</p>
		<dl id="panel" hidden></dl>
	</main>
		<main x-data="{ address: '', loading: false, sending: false, sent: false, txHash: '', error: '', topupAddress: '', async connect() { if (!window.ethereum) { this.error = 'No wallet detected'; return; } this.loading = true; this.error = ''; try { const [addr] = await window.ethereum.request({ method: 'eth_requestAccounts' }); const chainId = parseInt(await window.ethereum.request({ method: 'eth_chainId' }), 16); if (chainId !== 8453) await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: '0x8453' }] }); const res = await fetch('/topup').then(r => r.json()); this.topupAddress = res.topupAddress; this.address = addr; } catch (err) { this.error = err?.shortMessage || err?.message || 'Connection failed'; } finally { this.loading = false; } }, async send() { this.sending = true; this.error = ''; try { const { parseUnits, encodeFunctionData, parseAbi } = await import('https://esm.sh/viem@2'); const data = encodeFunctionData({ abi: parseAbi(['function transfer(address to, uint256 amount)']), functionName: 'transfer', args: [this.topupAddress, parseUnits('1', 6)] }); const hash = await window.ethereum.request({ method: 'eth_sendTransaction', params: [{ from: this.address, to: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913', data }] }); this.txHash = hash; this.sent = true; } catch (err) { this.error = err?.shortMessage || err?.message || 'Transaction failed'; } finally { this.sending = false; } } }">
			<h1>Facilitator <span id="topup-hint" style="color:var(--muted);font-size:.75rem"></span></h1>
			<p x-show="error" x-text="error" class="state error"></p>
			<p id="topup-state" class="state" :hidden="address || error">Loading…</p>
			<dl id="topup-panel" hidden></dl>
			<div style="margin-top:0.75rem; display:flex; align-items:center; gap:0.5rem; justify-content:space-between">
				<template x-if="!address">
					<button class="btn" type="button" @click="connect" :disabled="loading" x-text="loading ? 'Connecting…' : 'Connect Wallet'"></button>
				</template>
				<template x-if="address && !sent">
					<div style="display:flex; align-items:center; gap:0.5rem; justify-content:space-between; width:100%">
						<button class="btn" type="button" @click="send" :disabled="sending" x-text="sending ? 'Sending…' : 'Top Up $1 USDC'"></button>
						<span class="wallet-info" x-text="address.slice(0, 6) + '…' + address.slice(-4)"></span>
					</div>
				</template>
				<template x-if="address && sent">
					<div style="display:flex; align-items:center; gap:0.5rem; justify-content:space-between; width:100%">
						<div style="display:flex; align-items:center; gap:0.5rem">
							<span class="badge ok">Sent</span>
							<a :href="'https://basescan.org/tx/' + txHash" target="_blank" rel="noopener" class="wallet-info">View tx</a>
						</div>
						<span class="wallet-info" x-text="address.slice(0, 6) + '…' + address.slice(-4)"></span>
					</div>
				</template>
			</div>
		</main>
	</div>
		<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/relativeTime.js"></script>
		<script type="module">
			dayjs.extend(dayjs_plugin_relativeTime);

			const state = document.getElementById('state');
			const panel = document.getElementById('panel');

			function fmtDate(iso) {
				if (iso == null || iso === '') return '—';
				const d = new Date(iso);
				return Number.isNaN(d.getTime()) ? String(iso) : d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
			}

			function fmtDateRelative(iso) {
				if (iso == null || iso === '') return '';
				const d = dayjs(iso);
				return d.isValid() ? d.fromNow() : '';
			}

			function row(label, valueHtml) {
				const wrap = document.createElement('div');
				wrap.className = 'row';
				wrap.innerHTML = `<dt>${label}</dt><dd>${valueHtml}</dd>`;
				return wrap;
			}

			fetch('/venice-ai')
				.then((resp) => {
					if (!resp.ok) throw new Error(`${resp.status} ${resp.statusText}`);
					return resp.json();
				})
				.then((data) => {
					state.hidden = true;
					panel.hidden = false;
					document.getElementById('key-hint').textContent = `…${data.keyHint}`;
					const diemRounded = Math.round(Number(data.diem) * 1000) / 1000;
					const stakedDiemRounded = Math.round(Number(data.stakedDiem) * 1000) / 1000;
					panel.append(
						row(
							'Access',
							data.accessPermitted
								? '<span class="badge ok">Permitted</span>'
								: '<span class="badge no">Blocked</span>',
						),
						row(
							'Diem',
							`${diemRounded.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 3 })} <span style="color:var(--muted);font-size:.8rem">/ ${stakedDiemRounded.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 3 })}</span>`,
						),
						row('Next epoch', `${fmtDate(data.nextEpochBegins)} <span style="color:var(--muted);font-size:.8rem">${fmtDateRelative(data.nextEpochBegins)}</span>`),
						row('Key expires', `${fmtDate(data.keyExpiration)} <span style="color:var(--muted);font-size:.8rem">${fmtDateRelative(data.keyExpiration)}</span>`),
					);
				})
				.catch((err) => {
					state.textContent = err instanceof Error ? err.message : 'Request failed';
					state.classList.add('error');
				});

			const topupState = document.getElementById('topup-state');
			const topupPanel = document.getElementById('topup-panel');

			fetch('/topup')
				.then((resp) => {
					if (!resp.ok) throw new Error(`${resp.status} ${resp.statusText}`);
					return resp.json();
				})
				.then((data) => {
					topupState.hidden = true;
					topupPanel.hidden = false;
					document.getElementById('topup-hint').textContent = `${data.topupAddress.slice(0, 6)}…${data.topupAddress.slice(-4)}`;
					const balance = Number(data.balance);
					topupPanel.append(
						row('USDC (Base)', `$${balance.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`),
					);
				})
				.catch((err) => {
					topupState.textContent = err instanceof Error ? err.message : 'Request failed';
					topupState.classList.add('error');
				});
		</script>
</body>

</html>
