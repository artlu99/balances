<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>My balances</title>
	<link rel="icon" href="/favicon.ico" sizes="any" />
	<link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
	<link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16" />
	<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
	<link rel="manifest" href="/site.webmanifest" />
	<meta name="theme-color" content="#ffffff" />
	<meta name="description" content="Venice AI DIEM balances and Base USDC facilitator top-up." />
	<meta property="og:type" content="website" />
	<meta property="og:site_name" content="My balances" />
	<meta property="og:title" content="My balances" />
	<meta property="og:description" content="Venice AI DIEM balances and Base USDC facilitator top-up." />
	<meta property="og:url" content="https://balances.artlu.xyz/" />
	<meta property="og:image" content="https://balances.artlu.xyz/og-image.png" />
	<meta name="twitter:card" content="summary_large_image" />
	<meta name="twitter:title" content="My balances" />
	<meta name="twitter:description" content="Venice AI DIEM balances and Base USDC facilitator top-up." />
	<meta name="twitter:image" content="https://balances.artlu.xyz/og-image.png" />
	<style>
		:root {
			color-scheme: light dark;
			--bg: #0f1216;
			--surface: #171b22;
			--border: #2a3140;
			--text: #e8ecf1;
			--muted: #8b96a8;
			--accent: #6ee7b7;
			--warn: #fbbf24;
			--danger: #f87171;
			--radius: 12px;
			font-family: system-ui, "Segoe UI", Roboto, sans-serif;
		}

		@media (prefers-color-scheme: light) {
			:root {
				--bg: #f4f6f9;
				--surface: #fff;
				--border: #e1e6ed;
				--text: #1a1f26;
				--muted: #5c6778;
			}
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 1.5rem;
			background: var(--bg);
			color: var(--text);
			line-height: 1.5;
		}

		.cards {
			width: min(28rem, 100%);
			display: grid;
			gap: 1rem;
		}

		main {
			width: 100%;
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			padding: 1.5rem 1.5rem 1.25rem;
			box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
		}

		h1 {
			margin: 0 0 1rem;
			font-size: 1.125rem;
			font-weight: 600;
			letter-spacing: -0.02em;
		}

		dl {
			margin: 0;
			display: grid;
			gap: 0.75rem 1rem;
		}

		.row {
			display: grid;
			grid-template-columns: auto 1fr;
			gap: 0.35rem 1rem;
			align-items: baseline;
		}

		dt {
			margin: 0;
			font-size: 0.75rem;
			font-weight: 600;
			text-transform: uppercase;
			letter-spacing: 0.06em;
			color: var(--muted);
		}

		dd {
			margin: 0;
			font-size: 0.95rem;
			font-variant-numeric: tabular-nums;
			text-align: right;
		}

		.badge {
			display: inline-block;
			padding: 0.15rem 0.5rem;
			border-radius: 999px;
			font-size: 0.8rem;
			font-weight: 600;
		}

		.badge.ok {
			background: color-mix(in srgb, var(--accent) 22%, transparent);
			color: var(--accent);
		}

		.badge.no {
			background: color-mix(in srgb, var(--danger) 22%, transparent);
			color: var(--danger);
		}

		.state {
			margin: 0;
			font-size: 0.9rem;
			color: var(--muted);
		}

		.state.error {
			color: var(--danger);
		}

		.btn {
			display: inline-block;
			padding: 0.4rem 0.9rem;
			border: 1px solid var(--border);
			border-radius: 8px;
			background: var(--surface);
			color: var(--text);
			font-size: 0.85rem;
			font-weight: 600;
			cursor: pointer;
			transition: opacity 0.15s;
		}

		.btn:hover:not(:disabled) {
			opacity: 0.85;
		}

		.btn:disabled {
			opacity: 0.45;
			cursor: default;
		}

		.wallet-info {
			font-size: 0.8rem;
			color: var(--muted);
			font-variant-numeric: tabular-nums;
		}

		.refresh-btn {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 0.4rem;
			width: 100%;
			padding: 0.55rem;
			color: var(--muted);
			font-size: 0.8rem;
			font-weight: 500;
		}

		.refresh-btn:hover:not(:disabled) {
			color: var(--text);
		}

		.refresh-btn svg {
			width: 14px;
			height: 14px;
			flex-shrink: 0;
		}

		.refresh-btn.loading svg {
			animation: spin 0.8s linear infinite;
		}

		@keyframes spin {
			to { transform: rotate(360deg); }
		}

		.balance-cell {
			display: flex;
			flex-direction: column;
			align-items: flex-end;
			gap: 0.35rem;
		}

		.balance-fraction {
			display: flex;
			align-items: baseline;
			justify-content: flex-end;
			gap: 0.4rem;
			flex-wrap: wrap;
		}

		.balance-fraction .muted {
			color: var(--muted);
			font-size: 0.8rem;
		}

		.pct-badge {
			display: inline-block;
			padding: 0.1rem 0.45rem;
			border-radius: 999px;
			font-size: 0.75rem;
			font-weight: 600;
			line-height: 1.3;
		}

		.pct-high {
			background: color-mix(in srgb, var(--accent) 22%, transparent);
			color: var(--accent);
		}

		.pct-mid {
			background: color-mix(in srgb, var(--warn) 22%, transparent);
			color: var(--warn);
		}

		.pct-low {
			background: color-mix(in srgb, var(--danger) 22%, transparent);
			color: var(--danger);
		}

		.pct-bar {
			width: 100%;
			height: 6px;
			border-radius: 999px;
			background: var(--border);
			overflow: hidden;
		}

		.pct-bar-fill {
			height: 100%;
			border-radius: 999px;
			transition: width 0.4s ease;
		}

		.pct-bar-fill.pct-high {
			background: var(--accent);
			box-shadow: 0 0 6px color-mix(in srgb, var(--accent) 40%, transparent);
		}

		.pct-bar-fill.pct-mid {
			background: var(--warn);
			box-shadow: 0 0 6px color-mix(in srgb, var(--warn) 40%, transparent);
		}

		.pct-bar-fill.pct-low {
			background: var(--danger);
			box-shadow: 0 0 6px color-mix(in srgb, var(--danger) 40%, transparent);
		}
	</style>
</head>

<body>
	<div class="cards">
		<main class="venice-card">
			<h1>Venice AI <span class="venice-hint" style="color:var(--muted);font-size:.75rem"></span></h1>
			<p class="venice-state state">Loading…</p>
			<dl class="venice-panel" hidden></dl>
		</main>
		<main x-data="{ address: '', loading: false, sending: false, sent: false, txHash: '', error: '', topupAddress: '', async connect() { if (!window.ethereum) { this.error = 'No wallet detected'; return; } this.loading = true; this.error = ''; try { const [addr] = await window.ethereum.request({ method: 'eth_requestAccounts' }); const chainId = parseInt(await window.ethereum.request({ method: 'eth_chainId' }), 16); if (chainId !== 8453) await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: '0x8453' }] }); const res = await fetch('/topup').then(r => r.json()); this.topupAddress = res.topupAddress; this.address = addr; } catch (err) { this.error = err?.shortMessage || err?.message || 'Connection failed'; } finally { this.loading = false; } }, async send() { this.sending = true; this.error = ''; try { const { parseUnits, encodeFunctionData, parseAbi } = await import('https://esm.sh/viem@2'); const data = encodeFunctionData({ abi: parseAbi(['function transfer(address to, uint256 amount)']), functionName: 'transfer', args: [this.topupAddress, parseUnits('1', 6)] }); const hash = await window.ethereum.request({ method: 'eth_sendTransaction', params: [{ from: this.address, to: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913', data }] }); this.txHash = hash; this.sent = true; } catch (err) { this.error = err?.shortMessage || err?.message || 'Transaction failed'; } finally { this.sending = false; } } }">
			<h1>Facilitator <span id="topup-hint" style="color:var(--muted);font-size:.75rem"></span></h1>
			<p x-show="error" x-text="error" class="state error"></p>
			<p id="topup-state" class="state" :hidden="address || error">Loading…</p>
			<dl id="topup-panel" hidden></dl>
			<div style="margin-top:0.75rem; display:flex; align-items:center; gap:0.5rem; justify-content:space-between">
				<template x-if="!address">
					<button class="btn" type="button" @click="connect" :disabled="loading" x-text="loading ? 'Connecting…' : 'Connect Wallet'"></button>
				</template>
				<template x-if="address && !sent">
					<div style="display:flex; align-items:center; gap:0.5rem; justify-content:space-between; width:100%">
						<button class="btn" type="button" @click="send" :disabled="sending" x-text="sending ? 'Sending…' : 'Top Up $1 USDC'"></button>
						<span class="wallet-info" x-text="address.slice(0, 6) + '…' + address.slice(-4)"></span>
					</div>
				</template>
				<template x-if="address && sent">
					<div style="display:flex; align-items:center; gap:0.5rem; justify-content:space-between; width:100%">
						<div style="display:flex; align-items:center; gap:0.5rem">
							<span class="badge ok">Sent</span>
							<a :href="'https://basescan.org/tx/' + txHash" target="_blank" rel="noopener" class="wallet-info">View tx</a>
						</div>
						<span class="wallet-info" x-text="address.slice(0, 6) + '…' + address.slice(-4)"></span>
					</div>
				</template>
			</div>
		</main>
		<button id="refresh-btn" class="btn refresh-btn" type="button">
			<svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3.3-7"/><polyline points="21 3 21 9 15 9"/></svg>
			Refresh
		</button>
		<main class="venice-card">
			<h1>Venice AI <span class="venice-hint" style="color:var(--muted);font-size:.75rem"></span></h1>
			<p class="venice-state state">Loading…</p>
			<dl class="venice-panel" hidden></dl>
		</main>
	</div>
		<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/relativeTime.js"></script>
		<script type="module">
			dayjs.extend(dayjs_plugin_relativeTime);

			const veniceCards = [...document.querySelectorAll('.venice-card')];
			const topupState = document.getElementById('topup-state');
			const topupPanel = document.getElementById('topup-panel');
			const refreshBtn = document.getElementById('refresh-btn');

			function fmtDate(iso) {
				if (iso == null || iso === '') return '—';
				const d = new Date(iso);
				return Number.isNaN(d.getTime()) ? String(iso) : d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
			}

			function fmtDateRelative(iso) {
				if (iso == null || iso === '') return '';
				const d = dayjs(iso);
				return d.isValid() ? d.fromNow() : '';
			}

			function row(label, valueHtml) {
				const wrap = document.createElement('div');
				wrap.className = 'row';
				wrap.innerHTML = `<dt>${label}</dt><dd>${valueHtml}</dd>`;
				return wrap;
			}

			function balanceIndicator(remaining, total, fmt) {
				const pct = total > 0 ? Math.round((remaining / total) * 100) : null;
				const tier = pct == null ? 'low' : pct >= 50 ? 'high' : pct >= 20 ? 'mid' : 'low';
				const fill = pct == null ? 0 : Math.min(pct, 100);
				const tierClass = { high: 'pct-high', mid: 'pct-mid', low: 'pct-low' }[tier];
				return `
					<div class="balance-cell">
						<div class="balance-fraction">
							${fmt(remaining)} <span class="muted">/ ${fmt(total)}</span>
						</div>
						<div class="pct-bar"><div class="pct-bar-fill ${tierClass}" style="width:${fill}%"></div></div>
					</div>`;
			}

			async function fetchJson(url) {
				const resp = await fetch(url);
				const data = await resp.json().catch(() => ({}));
				if (!resp.ok) {
					const step = data.step ? ` (${data.step})` : '';
					throw new Error(`${resp.status}: ${data.error ?? resp.statusText}${step}`);
				}
				return data;
			}

			function resetPanel(loadingEl, dataPanel) {
				loadingEl.hidden = false;
				loadingEl.textContent = 'Loading…';
				loadingEl.classList.remove('error');
				dataPanel.hidden = true;
				dataPanel.innerHTML = '';
			}

			function showError(el, err) {
				el.textContent = err instanceof Error ? err.message : 'Request failed';
				el.classList.add('error');
			}

			function renderVenice(card, data) {
				const state = card.querySelector('.venice-state');
				const panel = card.querySelector('.venice-panel');
				const hint = card.querySelector('.venice-hint');

				if (!data.ok) {
					showError(state, formatAccountError(data));
					panel.hidden = true;
					panel.innerHTML = '';
					if (data.walletHint || data.keyHint) {
						hint.textContent = formatHint(data.walletHint, data.keyHint);
					}
					return;
				}

				state.hidden = true;
				panel.hidden = false;
				panel.innerHTML = '';
				hint.textContent = formatHint(data.walletHint, data.keyHint);
				const diem = Math.round(Number(data.diem) * 1000) / 1000;
				const staked = Math.round(Number(data.stakedDiem) * 1000) / 1000;
				const fmt = (n) => n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 3 });
				panel.append(
					row('Access', data.accessPermitted ? '<span class="badge ok">Permitted</span>' : '<span class="badge no">Blocked</span>'),
					row('Diem', balanceIndicator(diem, staked, fmt)),
					row('Next epoch', `${fmtDate(data.nextEpochBegins)} <span style="color:var(--muted);font-size:.8rem">${fmtDateRelative(data.nextEpochBegins)}</span>`),
					row('Key expires', `${fmtDate(data.keyExpiration)} <span style="color:var(--muted);font-size:.8rem">${fmtDateRelative(data.keyExpiration)}</span>`),
				);
			}

			function formatHint(walletHint, keyHint) {
				const parts = [];
				if (walletHint) parts.push(walletHint);
				if (keyHint) parts.push(`key …${keyHint}`);
				return parts.join(' · ');
			}

			function formatAccountError(data) {
				const step = data.step ? ` (${data.step})` : '';
				return `${data.error ?? 'Request failed'}${step}`;
			}

			function renderVeniceAccounts(data) {
				data.accounts.forEach((account, i) => {
					if (veniceCards[i]) renderVenice(veniceCards[i], account);
				});
			}

			function renderTopup(data) {
				topupState.hidden = true;
				topupPanel.hidden = false;
				document.getElementById('topup-hint').textContent = `${data.topupAddress.slice(0, 6)}…${data.topupAddress.slice(-4)}`;
				const balance = Number(data.balance);
				topupPanel.append(
					row('USDC (Base)', `$${balance.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`),
				);
			}

			function refresh() {
				refreshBtn.disabled = true;
				refreshBtn.classList.add('loading');
				veniceCards.forEach((card) => {
					resetPanel(card.querySelector('.venice-state'), card.querySelector('.venice-panel'));
					card.querySelector('.venice-hint').textContent = '';
				});
				resetPanel(topupState, topupPanel);

				Promise.all([
					fetchJson('/venice-ai').then(renderVeniceAccounts).catch((err) => {
						veniceCards.forEach((card) => {
							showError(card.querySelector('.venice-state'), err);
						});
					}),
					fetchJson('/topup').then(renderTopup).catch((err) => showError(topupState, err)),
				]).finally(() => {
					refreshBtn.disabled = false;
					refreshBtn.classList.remove('loading');
				});
			}

			refreshBtn.addEventListener('click', refresh);
			refresh();
		</script>
</body>

</html>
